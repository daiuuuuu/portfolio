name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Grant the job permission to deploy to GitHub Pages and mint an id-token
# (needed by actions/configure-pages). Only one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: GitHub Pages returns 404 for direct hits on client-side
      # routes (/portfolio/project/xxx). Copying index.html to 404.html makes
      # React Router re-serve the app for any unknown path.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
