<body class="scanlines bg-background text-on-surface p-8">
<!--
  组件来源: 1.html (SYNTAX_OS_V.4)
  设计系统: SYNTAX_OS Dark Terminal
  组件类型: 系统日志数据表 - LOGS标题 + 排序标签 + 四列表格(TIMESTAMP/EVENT/NODE/STATUS) + 行悬停高亮
-->
<div>
  <!-- 表头 -->
  <div class="flex items-baseline justify-between mb-8">
    <h3 class="font-headline-lg text-[64px] font-black tracking-tighter leading-none">LOGS</h3>
    <span class="font-code-sm text-code-sm opacity-40">SORT_BY: CHRONO</span>
  </div>
  <!-- 数据表格 -->
  <div class="space-y-1 font-code-sm text-code-sm overflow-x-auto">
    <table class="w-full text-left">
      <thead class="border-b border-outline-variant">
        <tr>
          <th class="py-2 opacity-50 font-label-caps">TIMESTAMP</th>
          <th class="py-2 opacity-50 font-label-caps">EVENT</th>
          <th class="py-2 opacity-50 font-label-caps">NODE</th>
          <th class="py-2 opacity-50 font-label-caps">STATUS</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-outline-variant/30">
        <tr class="hover:bg-surface-container transition-colors">
          <td class="py-3">12:00:04.22</td>
          <td>KERNEL_PATCH_APPLIED</td>
          <td>CORE_01</td>
          <td class="text-primary">COMPLETED</td>
        </tr>
        <tr class="hover:bg-surface-container transition-colors">
          <td class="py-3">12:04:15.89</td>
          <td>EXTERNAL_PING_DETECTION</td>
          <td>GATEWAY_X</td>
          <td class="text-secondary">IGNORED</td>
        </tr>
        <tr class="hover:bg-surface-container transition-colors">
          <td class="py-3">12:15:22.01</td>
          <td>DATA_PACKET_ENCRYPTION</td>
          <td>NOD_LINK</td>
          <td class="text-primary">ACTIVE</td>
        </tr>
        <tr class="hover:bg-surface-container transition-colors">
          <td class="py-3">12:18:44.56</td>
          <td>TEMP_THRESHOLD_EXCEEDED</td>
          <td>THERMAL_02</td>
          <td class="text-error font-bold underline">WARNING</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
