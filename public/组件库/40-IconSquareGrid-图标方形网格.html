<body class="scanlines bg-background text-on-surface p-8">
<!--
  组件来源: 1.html (SYNTAX_OS_V.4)
  设计系统: SYNTAX_OS Dark Terminal
  组件类型: 图标方形网格 - REBOOT标题 + 描述 + 4个方形图标卡片(database/cloud_sync/shield/api)
-->
<section class="flex flex-col md:flex-row gap-12 items-center">
  <!-- 左侧标题+描述 -->
  <div class="w-full md:w-1/3">
    <h2 class="font-headline-lg text-headline-lg leading-none tracking-tighter mb-4 text-primary">REBOOT<br/>REQUIRED.</h2>
    <p class="font-body-md text-body-md opacity-60">
      System cache is reaching critical mass. Flush buffers before proceeding to the next architecture phase.
    </p>
  </div>
  <!-- 右侧图标网格 -->
  <div class="flex-1 w-full grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="aspect-square border border-outline-variant p-4 flex flex-col justify-between hover:border-primary transition-all group">
      <span class="font-label-caps text-label-caps opacity-30 group-hover:opacity-100">01</span>
      <span class="material-symbols-outlined text-[40px] text-primary">database</span>
    </div>
    <div class="aspect-square border border-outline-variant p-4 flex flex-col justify-between hover:border-primary transition-all group">
      <span class="font-label-caps text-label-caps opacity-30 group-hover:opacity-100">02</span>
      <span class="material-symbols-outlined text-[40px] text-primary">cloud_sync</span>
    </div>
    <div class="aspect-square border border-outline-variant p-4 flex flex-col justify-between hover:border-primary transition-all group">
      <span class="font-label-caps text-label-caps opacity-30 group-hover:opacity-100">03</span>
      <span class="material-symbols-outlined text-[40px] text-primary">shield_with_heart</span>
    </div>
    <div class="aspect-square border border-outline-variant p-4 flex flex-col justify-between hover:border-primary transition-all group">
      <span class="font-label-caps text-label-caps opacity-30 group-hover:opacity-100">04</span>
      <span class="material-symbols-outlined text-[40px] text-primary">api</span>
    </div>
  </div>
</section>
</body>
