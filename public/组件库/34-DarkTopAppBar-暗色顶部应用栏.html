<body class="scanlines bg-background text-on-surface">
<!--
  组件来源: 1.html (SYNTAX_OS_V.4)
  设计系统: SYNTAX_OS Dark Terminal
  组件类型: 暗色顶部应用栏 - sticky header + 系统名 + 导航链接 + 图标按钮组
-->
<header class="flex justify-between items-center w-full px-margin-desktop py-4 bg-surface border-b border-outline-variant sticky top-0 z-30">
  <!-- 系统标识 -->
  <div class="font-label-caps text-label-caps text-primary tracking-[0.2em]">SYNTAX_OS_V.4</div>
  <!-- 导航链接 -->
  <div class="flex items-center gap-8">
    <nav class="hidden lg:flex gap-6 items-center">
      <span class="font-code-sm text-code-sm uppercase tracking-tighter text-primary font-bold">SYSTEM_LOG</span>
      <span class="font-code-sm text-code-sm uppercase tracking-tighter text-on-surface-variant hover:bg-secondary-container transition-colors duration-150 px-2 cursor-pointer">TELEMETRY</span>
      <span class="font-code-sm text-code-sm uppercase tracking-tighter text-on-surface-variant hover:bg-secondary-container transition-colors duration-150 px-2 cursor-pointer">PROTOCOL_V3</span>
    </nav>
    <!-- 图标按钮 -->
    <div class="flex gap-4">
      <span class="material-symbols-outlined text-primary text-[20px] cursor-pointer">terminal</span>
      <span class="material-symbols-outlined text-on-surface-variant text-[20px] cursor-pointer">sensors</span>
      <span class="material-symbols-outlined text-on-surface-variant text-[20px] cursor-pointer">settings</span>
    </div>
  </div>
</header>
</body>
