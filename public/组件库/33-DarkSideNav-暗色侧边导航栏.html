<meta charset="utf-8"/>

<title>33-DarkSideNav-暗色侧边导航栏</title>

<style>
  html,body{scrollbar-width:none;-ms-overflow-style:none;}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
  body { background-color: #111318; color: #e2e2e8; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; cursor: crosshair; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .glow-text { text-shadow: 0 0 8px rgba(203,190,255,0.4); }
  .scanlines::after{content:" ";display:block;position:fixed;top:0;left:0;bottom:0;right:0;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,0.1) 50%),linear-gradient(90deg,rgba(255,0,0,0.02),rgba(0,255,0,0.01),rgba(0,0,155,0.02));z-index:100;background-size:100% 2px,3px 100%;pointer-events:none;}
</style>

<body class="scanlines bg-background text-on-surface">
<!--
  组件来源: 1.html (SYNTAX_OS_V.4)
  设计系统: SYNTAX_OS Dark Terminal
  组件类型: 暗色侧边导航栏 - ROOT品牌标识 + 图标导航链接 + INITIALIZE_CORE按钮 + 底部控制图标
-->
<aside class="flex flex-col h-[520px] w-64 bg-surface-container-low border-r border-outline-variant overflow-hidden">
  <!-- 品牌区 -->
  <div class="p-6 border-b border-outline-variant">
    <div class="font-headline-lg text-headline-lg text-on-surface tracking-tighter leading-none mb-2">ROOT</div>
    <div class="font-label-caps text-label-caps text-primary glow-text">192.168.1.1</div>
  </div>
  <!-- 导航链接 -->
  <nav class="flex-1 py-8">
    <ul class="space-y-1">
      <li>
        <a class="flex items-center gap-4 text-primary border-l-4 border-primary bg-surface-container-highest pl-4 py-3 transition-all shadow-[0_0_10px_rgba(203,190,255,0.2)]" href="#">
          <span class="material-symbols-outlined text-[18px]">grid_view</span>
          <span class="font-label-caps text-label-caps">INDEX</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-4 text-on-surface-variant pl-4 py-3 hover:text-primary hover:bg-surface-container transition-all" href="#">
          <span class="material-symbols-outlined text-[18px]">layers</span>
          <span class="font-label-caps text-label-caps">MATRIX</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-4 text-on-surface-variant pl-4 py-3 hover:text-primary hover:bg-surface-container transition-all" href="#">
          <span class="material-symbols-outlined text-[18px]">hub</span>
          <span class="font-label-caps text-label-caps">NODES</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-4 text-on-surface-variant pl-4 py-3 hover:text-primary hover:bg-surface-container transition-all" href="#">
          <span class="material-symbols-outlined text-[18px]">lock_open</span>
          <span class="font-label-caps text-label-caps">DECRYPT</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-4 text-on-surface-variant pl-4 py-3 hover:text-primary hover:bg-surface-container transition-all" href="#">
          <span class="material-symbols-outlined text-[18px]">folder_zip</span>
          <span class="font-label-caps text-label-caps">ARCHIVE</span>
        </a>
      </li>
    </ul>
  </nav>
  <!-- 底部操作区 -->
  <div class="p-6 mt-auto border-t border-outline-variant">
    <button class="w-full py-3 bg-primary text-on-primary font-label-caps text-label-caps hover:shadow-[0_0_15px_rgba(203,190,255,0.5)] transition-all mb-4">
      INITIALIZE_CORE
    </button>
    <div class="flex justify-between items-center opacity-50">
      <span class="material-symbols-outlined hover:text-primary cursor-pointer">restart_alt</span>
      <span class="material-symbols-outlined hover:text-primary cursor-pointer">logout</span>
    </div>
  </div>
</aside>
</body>
</html>
