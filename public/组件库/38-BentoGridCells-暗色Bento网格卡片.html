  <div class="border-b border-r border-outline-variant p-margin-desktop aspect-video relative group overflow-hidden">

      <span class="font-label-caps text-label-caps bg-primary text-on-primary px-2 self-start">MODULE_01</span>
      <div>
        <h4 class="font-headline-lg text-headline-lg tracking-tighter mb-2">INTERFACE_A</h4>
        <p class="font-code-sm text-code-sm opacity-60">FRAGMENTED STRUCTURE FOR RAPID DATA ACCESS</p>

      <div class="flex items-center gap-4">
        <span class="font-display-2xl text-[48px] font-black text-primary">04</span>
        <div class="h-[1px] flex-1 bg-outline-variant"></div>
      </div>
      <h4 class="font-label-caps text-label-caps">ACTIVE_THREATS_DETECTED</h4>

        NULL :: NO THREATS DETECTED IN LOCAL RANGE. THE PERIMETER IS SECURE.
